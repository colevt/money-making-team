<style>
@keyframes pulse { 0%,100%{opacity:.5} 50%{opacity:1} }
@keyframes dash { to { stroke-dashoffset:-18 } }
.stage { transition: opacity .3s }
.stage.dim { opacity: .28 }
.stage.hot { animation: pulse 1.1s ease-in-out infinite }
#token { transition: transform .6s cubic-bezier(.4,0,.2,1), opacity .3s }
#ret.live { stroke-dasharray:5 4; animation: dash 1s linear infinite }
@media (prefers-reduced-motion: reduce) { .stage.hot, #ret.live { animation:none } }
</style>

<line x1="212" y1="294" x2="246" y2="238" class="arr" marker-end="url(#arrow)"/>

</svg>
<div style="display:flex;align-items:center;gap:14px;margin-top:12px;font-size:13px;color:var(--text-secondary)">
<button id="play" onclick="toggle()" style="min-width:96px"><i class="ti ti-player-pause" aria-hidden="true" style="font-size:16px;vertical-align:-3px;margin-right:6px"></i><span id="playtxt">Pause</span></button>
<button onclick="jump()">Next step</button>
<span>Speed</span>
<input type="range" id="spd" min="1" max="10" step="1" value="5" style="flex:1">
</div>
<div style="margin-top:10px;padding:10px 12px;background:var(--surface-1);border-radius:var(--radius);font-size:13px;color:var(--text-primary);min-height:20px">
<span id="badge" style="font-family:var(--font-mono);font-size:12px;padding:2px 8px;border-radius:var(--radius);background:var(--bg-accent);color:var(--text-accent);margin-right:10px">cycle 1</span><span id="status">starting</span>
</div>
<script>
const ids=['brain','s1','s2','s3','s4','s5','mm','quiet','bot','post','fill','watch','settle','blotter'];
const P={brain:[340,64],mm:[340,228],quiet:[540,226],bot:[340,314],post:[340,400],fill:[340,480],watch:[340,554],settle:[340,628],blotter:[125,628]};
const ingest={act:['s1','s2','s3','s4','s5'],pos:null,txt:'polling whales, X lag, ESPN, crypto feeds and both live books'};
const score={act:['mm','brain'],pos:P.mm,txt:'scoring with current weights: model edge vs the live book'};
const trade=[ingest,score,
{act:['mm','bot'],pos:P.bot,txt:'6% gap cleared, ticket sized against side and size caps'},
{act:['post'],pos:P.post,txt:'venue confirmed live and under cap, order signed and sent'},
{act:['fill'],pos:P.fill,txt:'filled, position now open'},
{act:['watch'],pos:P.watch,txt:'flatten-watch armed, monitoring for exit triggers'},
{act:['settle'],pos:P.settle,txt:'market resolved, PnL booked'},
{act:['blotter'],pos:P.blotter,txt:'written to the Desk blotter'},
{act:['brain'],pos:P.brain,txt:'learning layer scores the outcome and retunes weights + the gate',ret:1}];
const quiet=[ingest,score,{act:['quiet'],pos:P.quiet,txt:'gap under 6%, stand down, no ticket sent'},
{act:['brain'],pos:P.brain,txt:'no trade to learn from, weights unchanged',ret:1}];
let i=0,c=1,run=true,tid=null;
const seq=()=>c%3===0?quiet:trade;
function draw(){const s=seq()[i];ids.forEach(id=>{const e=document.getElementById(id);e.classList.toggle('dim',!s.act.includes(id));e.classList.toggle('hot',s.act.includes(id));});
const t=document.getElementById('token');if(s.pos){t.setAttribute('opacity','1');t.style.transform='translate('+s.pos[0]+'px,'+s.pos[1]+'px)';}else{t.setAttribute('opacity','0');t.style.transform='translate(125px,228px)';}
document.getElementById('ret').classList.toggle('live',!!s.ret);
document.getElementById('status').textContent=s.txt;
document.getElementById('badge').textContent=(c%3===0?'quiet cycle ':'cycle ')+c;}
function step(){i++;if(i>=seq().length){i=0;c++;}draw();}
function tick(){if(!run)return;const d=2400-parseInt(document.getElementById('spd').value)*190;tid=setTimeout(()=>{step();tick();},d);}
function toggle(){run=!run;if(tid)clearTimeout(tid);document.getElementById('playtxt').textContent=run?'Pause':'Play';document.getElementById('play').querySelector('i').className=run?'ti ti-player-pause':'ti ti-player-play';if(run)tick();}
function jump(){if(tid)clearTimeout(tid);step();if(run)tick();}
draw();
if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){run=false;document.getElementById('playtxt').textContent='Play';document.getElementById('play').querySelector('i').className='ti ti-player-play';}else{tick();}
</script>
